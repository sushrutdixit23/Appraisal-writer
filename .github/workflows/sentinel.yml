name: Sentinel checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
      - name: Unit and route tests
        run: npm run test:sentinel
      - name: Database migrations (embedded Postgres)
        run: npm run test:migrations
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:4010
          NEXT_PUBLIC_SUPABASE_ANON_KEY: anon
